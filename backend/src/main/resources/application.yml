spring:
  application:
    name: eav02-backend
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation: INFO
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:http://localhost:8080}
  audience: eav02-api
