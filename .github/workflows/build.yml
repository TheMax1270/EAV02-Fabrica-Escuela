name: SonarQube

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_KEY: TheMax1270_EAV02-Fabrica-Escuela
  MIN_COVERAGE: 65
  MAX_DEBT_MIN: 960
  MAX_COMPLEXITY: 50

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 21
          distribution: zulu

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.scanner.skipJreProvisioning=true

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn

      - name: Wait for Sonar processing
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ ! -f target/sonar/report-task.txt ]; then
            echo "::warning::No hay reporte de Sonar que procesar."
            exit 0
          fi

          URL=$(grep ceTaskUrl target/sonar/report-task.txt | cut -d= -f2-)

          for i in $(seq 1 30); do
            S=$(curl -s -u "$SONAR_TOKEN:" "$URL" | jq -r '.task.status')

            echo "Estado Sonar: $S"

            case "$S" in
              SUCCESS)
                exit 0
                ;;
              FAILED|CANCELED)
                echo "::warning::El análisis de Sonar terminó con estado $S"
                exit 0
                ;;
            esac

            sleep 5
          done

          echo "::warning::Timeout esperando a Sonar"
          exit 0

      - name: Validate quality criteria (informativo, no bloquea)
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          API=https://sonarcloud.io/api

          if [ "$EVENT_NAME" = "pull_request" ]; then
            SCOPE="pullRequest=$PR_NUMBER"
          else
            SCOPE="branch=$BRANCH"
          fi

          RESP=$(curl -s -u "$SONAR_TOKEN:" \
            "$API/measures/component?component=$PROJECT_KEY&$SCOPE&metricKeys=coverage,sqale_index,complexity,new_coverage,new_technical_debt")

          if ! echo "$RESP" | jq -e '.component' >/dev/null 2>&1; then
            echo "::warning::Error de Sonar: $RESP"
            exit 0
          fi

          M=$(echo "$RESP" | jq -r '.component.measures[] | "\(.metric)=\(.value // .period.value)"')

          get() {
            echo "$M" | grep "^$1=" | cut -d= -f2
          }

          COV=$(get coverage)
          [ -z "$COV" ] && COV=$(get new_coverage)

          DEBT=$(get sqale_index)
          [ -z "$DEBT" ] && DEBT=$(get new_technical_debt)

          CX=$(get complexity)

          RESP_F=$(curl -s -u "$SONAR_TOKEN:" \
            "$API/measures/component_tree?component=$PROJECT_KEY&$SCOPE&metricKeys=complexity&qualifiers=FIL&s=metric&metricSort=complexity&asc=false&ps=1")

          CX_MAX=$(echo "$RESP_F" | jq -r '.components[0].measures[]? | select(.metric=="complexity") | .value' | head -1)
          CX_FILE=$(echo "$RESP_F" | jq -r '.components[0].name // "N/A"')

          RESP_V=$(curl -s -u "$SONAR_TOKEN:" \
            "$API/issues/search?componentKeys=$PROJECT_KEY&$SCOPE&types=VULNERABILITY&severities=CRITICAL,BLOCKER&resolved=false&ps=1")

          VULN=$(echo "$RESP_V" | jq -r '.total // "N/A"')

          ok() {
            echo "✅"
          }

          bad() {
            echo "❌"
          }

          COV_S=$(awk "BEGIN{exit !(${COV:-0} >= $MIN_COVERAGE)}" && ok || bad)

          DEBT_S=$(
            [ -n "$DEBT" ] &&
            [ "$DEBT" -le "$MAX_DEBT_MIN" ] &&
            ok || bad
          )

          CX_S=$(
            [ -n "$CX" ] &&
            [ "$CX" -lt "$MAX_COMPLEXITY" ] &&
            ok || bad
          )

          CXM_S=$(
            [ -n "$CX_MAX" ] &&
            [ "$CX_MAX" -lt "$MAX_COMPLEXITY" ] &&
            ok || bad
          )

          VULN_S=$(
            [ "$VULN" = "0" ] &&
            ok || bad
          )

          {
            echo "### Resultado de calidad ($SCOPE)"
            echo "| Criterio | Valor | Meta | Estado |"
            echo "|---|---|---|---|"
            echo "| Cobertura | ${COV:-N/A}% | ≥ ${MIN_COVERAGE}% | $COV_S |"
            echo "| Deuda técnica | ${DEBT:-N/A} min | ≤ ${MAX_DEBT_MIN} min | $DEBT_S |"
            echo "| Complejidad ciclomática (total del proyecto) | ${CX:-N/A} | < ${MAX_COMPLEXITY} | $CX_S |"
            echo "| Complejidad ciclomática (archivo más complejo: $CX_FILE) | ${CX_MAX:-N/A} | < ${MAX_COMPLEXITY} | $CXM_S |"
            echo "| Vulnerabilidades críticas | $VULN | 0 | $VULN_S |"
          } >> "$GITHUB_STEP_SUMMARY"

          if echo "$COV_S$DEBT_S$CX_S$CXM_S$VULN_S" | grep -q "❌"; then
            echo "::warning title=Quality gates::Algunos criterios no se cumplen. Revisa la tabla en Summary."
          fi

          exit 0
