name: SonarQube

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_KEY: TheMax1270_EAV02-Fabrica-Escuela
  MIN_COVERAGE: 65        # % cobertura mínima
  MAX_DEBT_MIN: 960       # 2 días = 2 x 8 h x 60 min
  MAX_COMPLEXITY: 50      # debe ser menor a este valor (se mide por método)

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Verify Sonar token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN está vacío (secreto no definido o sin acceso)."
            exit 1
          fi
          VALID=$(curl -s -u "$SONAR_TOKEN:" https://sonarcloud.io/api/authentication/validate | jq -r '.valid')
          if [ "$VALID" != "true" ]; then
            echo "::error::SONAR_TOKEN es inválido, expiró o fue revocado."
            exit 1
          fi
          ORGS=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/organizations/search?member=true" | jq -r '.organizations[].key')
          if ! echo "$ORGS" | grep -qx "devconnect"; then
            echo "::error::El dueño del token no es miembro de la organización devconnect."
            exit 1
          fi
          echo "Token de Sonar válido y con acceso a devconnect."

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.scanner.skipJreProvisioning=true

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn

      - name: Wait for Sonar processing
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ ! -f target/sonar/report-task.txt ]; then
            echo "::warning::No hay reporte de Sonar que procesar."
            exit 0
          fi
          URL=$(grep ceTaskUrl target/sonar/report-task.txt | cut -d= -f2-)
          for i in $(seq 1 30); do
            S=$(curl -s -u "$SONAR_TOKEN:" "$URL" | jq -r '.task.status')
            echo "Estado Sonar: $S"
            case "$S" in
              SUCCESS) exit 0 ;;
              FAILED|CANCELED) echo "::warning::El análisis de Sonar terminó con estado $S"; exit 0 ;;
            esac
            sleep 5
          done
          echo "::warning::Timeout esperando a Sonar"
          exit 0

      - name: Validate quality criteria (informativo, no bloquea)
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          API=https://sonarcloud.io/api

          # En un Pull Request se consulta por número de PR; en un push, por rama.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SCOPE="pullRequest=$PR_NUMBER"
          else
            SCOPE="branch=$BRANCH"
          fi

          RESP=$(curl -s -u "$SONAR_TOKEN:" \
            "$API/measures/component?component=$PROJECT_KEY&$SCOPE&metricKeys=coverage,sqale_index,new_coverage,new_technical_debt")
          if ! echo "$RESP" | jq -e '.component' >/dev/null 2>&1; then
            echo "::warning::Error de Sonar: $RESP"
            exit 0
          fi

          M=$(echo "$RESP" | jq -r '.component.measures[] | "\(.metric)=\(.value // .period.value)"')
          get() { echo "$M" | grep "^$1=" | cut -d= -f2; }

          COV=$(get coverage);       [ -z "$COV" ]  && COV=$(get new_coverage)
          DEBT=$(get sqale_index);   [ -z "$DEBT" ] && DEBT=$(get new_technical_debt)

          # ---- Complejidad ciclomática POR MÉTODO (fuente: reporte JaCoCo; Sonar no la expone por método) ----
          JACOCO=target/site/jacoco/jacoco.xml
          METHODS=$(python3 - "$JACOCO" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
          except Exception:
              sys.exit(0)
          rows = []
          for pk in root.iter('package'):
              for c in pk.findall('class'):
                  cname = c.get('name').split('/')[-1]
                  for m in c.findall('method'):
                      cx = 0
                      for ctr in m.findall('counter'):
                          if ctr.get('type') == 'COMPLEXITY':
                              cx = int(ctr.get('missed')) + int(ctr.get('covered'))
                      rows.append((cx, cname, m.get('name')))
          rows.sort(key=lambda r: (-r[0], r[1], r[2]))
          for cx, cn, mn in rows:
              print(f"{cx}|{cn}|{mn}")
          PY
          )

          M_TOTAL=$(printf '%s\n' "$METHODS" | grep -c '|')
          if [ "$M_TOTAL" -gt 0 ]; then
            M_TOP=$(printf '%s\n' "$METHODS" | head -n 1)
            M_MAX=${M_TOP%%|*}
            M_NAME=$(echo "${M_TOP#*|}" | tr '|' '.')
            M_OVER=$(printf '%s\n' "$METHODS" | awk -F'|' -v m="$MAX_COMPLEXITY" '$1 >= m' | wc -l)
            M_WARN=$(printf '%s\n' "$METHODS" | awk -F'|' '$1 > 10' | wc -l)
          else
            M_MAX=""; M_NAME="N/A"; M_OVER="N/A"; M_WARN="N/A"
          fi

          # ---- Referencia: complejidad por archivo y por módulo (Sonar, informativo) ----
          PAGE=1
          ALL='[]'
          while :; do
            R=$(curl -s -u "$SONAR_TOKEN:" \
              "$API/measures/component_tree?component=$PROJECT_KEY&$SCOPE&metricKeys=complexity&qualifiers=FIL&ps=500&p=$PAGE")
            echo "$R" | jq -e '.components' >/dev/null 2>&1 || break
            ALL=$(jq -c -n --argjson a "$ALL" --argjson b "$(echo "$R" | jq -c '.components')" '$a + $b')
            TOTAL=$(echo "$R" | jq -r '.paging.total')
            [ $((PAGE * 500)) -ge "$TOTAL" ] && break
            PAGE=$((PAGE + 1))
          done
          FILES=$(echo "$ALL" | jq -c '[.[] | {path: (.path // .name), cx: ((.measures[]? | select(.metric=="complexity") | .value | tonumber) // 0)}]')
          MODS=$(echo "$FILES" | jq -r '[.[] | select(.path | test("com/eav02/backend/[^/]+/")) | {m: (.path | capture("com/eav02/backend/(?<m>[^/]+)/").m), cx}] | group_by(.m) | map({m: .[0].m, cx: (map(.cx) | add)}) | sort_by(-.cx) | .[] | "\(.m)|\(.cx)"')
          MAXF=$(echo "$FILES" | jq -r 'if length == 0 then "N/A|" else (max_by(.cx) | "\(.path | split("/") | last)|\(.cx)") end')
          CX_FILE=${MAXF%%|*}
          CX_FMAX=${MAXF##*|}

          RESP_V=$(curl -s -u "$SONAR_TOKEN:" \
            "$API/issues/search?componentKeys=$PROJECT_KEY&$SCOPE&types=VULNERABILITY&severities=CRITICAL,BLOCKER&resolved=false&ps=1")
          VULN=$(echo "$RESP_V" | jq -r '.total // "N/A"')

          RESP_S=$(curl -s -u "$SONAR_TOKEN:" \
            "$API/issues/search?componentKeys=$PROJECT_KEY&$SCOPE&severities=MINOR,MAJOR,CRITICAL,BLOCKER&resolved=false&ps=1")
          SEV=$(echo "$RESP_S" | jq -r '.total // "N/A"')

          ok()  { echo "✅"; }
          bad() { echo "❌"; }

          COV_S=$(awk "BEGIN{exit !(${COV:-0} >= $MIN_COVERAGE)}" && ok || bad)
          DEBT_S=$([ -n "$DEBT" ] && [ "$DEBT" -le "$MAX_DEBT_MIN" ] && ok || bad)
          CX_S=$([ -n "$M_MAX" ] && [ "$M_MAX" -lt "$MAX_COMPLEXITY" ] && ok || bad)
          VULN_S=$([ "$VULN" = "0" ] && ok || bad)
          SEV_S=$([ "$SEV" = "0" ] && ok || bad)

          {
            echo "### Resultado de calidad ($SCOPE)"
            echo "| Criterio | Valor | Meta | Estado |"
            echo "|---|---|---|---|"
            echo "| Cobertura | ${COV:-N/A}% | ≥ ${MIN_COVERAGE}% | $COV_S |"
            echo "| Deuda técnica | ${DEBT:-N/A} min | ≤ ${MAX_DEBT_MIN} min | $DEBT_S |"
            printf '| Complejidad ciclomática por método (máximo: `%s`) | %s | cada método < %s | %s |\n' "$M_NAME" "${M_MAX:-N/A}" "$MAX_COMPLEXITY" "$CX_S"
            echo "| Vulnerabilidades críticas | $VULN | 0 | $VULN_S |"
            echo "| Hallazgos abiertos (severidad Minor o superior) | $SEV | 0 | $SEV_S |"
            echo ""
            echo "Métodos analizados: $M_TOTAL · métodos con complejidad ≥ ${MAX_COMPLEXITY}: $M_OVER · métodos con complejidad > 10 (referencia de buena práctica): $M_WARN"
            echo ""
            echo "#### Los 5 métodos más complejos"
            echo "| Método | Complejidad |"
            echo "|---|---|"
            printf '%s\n' "$METHODS" | head -n 5 | while IFS='|' read -r CX CN MN; do
              [ -z "$CX" ] && continue
              printf '| `%s.%s` | %s |\n' "$CN" "$MN" "$CX"
            done
            echo ""
            echo "#### Referencia (SonarCloud, informativo): complejidad por archivo y por módulo"
            echo "Archivo más complejo: $CX_FILE ($CX_FMAX)"
            echo ""
            echo "| Módulo | Complejidad acumulada |"
            echo "|---|---|"
            while IFS='|' read -r NAME CX; do
              [ -z "$NAME" ] && continue
              echo "| $NAME | $CX |"
            done <<< "$MODS"
          } >> "$GITHUB_STEP_SUMMARY"

          if echo "$COV_S$DEBT_S$CX_S$VULN_S$SEV_S" | grep -q "❌"; then
            echo "::warning title=Quality gates::Algunos criterios no se cumplen. Revisa la tabla en Summary."
          fi

          exit 0