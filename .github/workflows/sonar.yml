name: SonarQube Cloud

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  analysis:
    name: Analisis de calidad (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache de dependencias Maven y Sonar
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.sonar/cache
          key: ${{ runner.os }}-m2-sonar-${{ hashFiles('backend/pom.xml') }}

      - name: Backend - pruebas y cobertura (JaCoCo)
        working-directory: backend
        run: mvn -B verify

      - name: Frontend - instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Frontend - pruebas y cobertura (Vitest)
        working-directory: frontend
        run: npm test

      - name: SonarQube Cloud Scan
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.javascript.lcov.reportPaths=../frontend/coverage/lcov.info
          -Dsonar.sources=src/main/java,../frontend/src
          -Dsonar.tests=src/test/java,../frontend/src
          -Dsonar.test.inclusions=**/*.test.tsx,**/*.test.ts